<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Launcher - bananaOS</title>
        <meta name="description" content="Launcher utility for bananaOS.">
        <meta name="robots" content="noindex">
        <link rel="icon" href="../../favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="../../styles/global.css">
        <link rel="stylesheet" href="./launcher.css">
        <script type="module" src="./launcher.js"></script>
    </head>

    <body class="window-content">
        <main id="launcher-container">
            <section id="search-section">
                <input type="text" id="search-input" placeholder="Search apps...">
            </section>
            <section id="apps-section">
                <h1 id="apps-title">Apps</h1>
                <div id="apps-grid"></div>
            </section>
        </main>
    </body>
</html>
