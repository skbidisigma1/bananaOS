<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Photos - bananaOS</title>
        <meta name="description" content="Photos app for bananaOS.">
        <meta name="robots" content="noindex">
        <link rel="icon" href="../../favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="../../styles/global.css">
        
        <link type="text/css" href="https://uicdn.toast.com/tui-color-picker/v2.2.6/tui-color-picker.css" rel="stylesheet">
        <link type="text/css" href="https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.css" rel="stylesheet">
        
        <link rel="stylesheet" href="./photos.css">

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/fabric@4.3.1/dist/index.min.js"></script>
        <script type="text/javascript" src="https://uicdn.toast.com/tui.code-snippet/v1.5.0/tui-code-snippet.min.js"></script>
        <script type="text/javascript" src="https://uicdn.toast.com/tui-color-picker/v2.2.6/tui-color-picker.js"></script>
        <script type="text/javascript" src="https://uicdn.toast.com/tui-image-editor/latest/tui-image-editor.js"></script>

        <script type="module" src="./photos.js"></script>
    </head>

    <body class="window-content">
        <header id="top-bar">
            <div class="top-bar-button" id="menu-file">
                <span class="top-bar-text">File</span>
                <div class="dropdown-menu hidden" id="dropdown-file">
                    <div class="dropdown-menu-item" id="file-new">New Image</div>
                    <div class="dropdown-menu-item" id="file-open">Open...</div>
                    <div class="dropdown-menu-item" id="file-save">Save</div>
                    <div class="dropdown-menu-item" id="file-save-as">Save As...</div>
                    <div class="dropdown-menu-separator"></div>
                    <div class="dropdown-menu-item" id="file-exit">Exit</div>
                </div>
            </div>
        </header>

        <div id="tui-image-editor-container"></div>
        
        <div id="discard-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="discard-title">Unsaved Changes</h2>
                <p id="discard-message">You have unsaved changes. Are you sure you want to proceed and lose them?</p>
                <div class="modal-buttons">
                    <button class="primary" id="discard-confirm">Discard</button>
                    <button id="discard-cancel">Cancel</button>
                </div>
            </div>
        </div>

        <div id="alert-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="alert-title">Notice</h2>
                <p id="alert-message"></p>
                <div class="modal-buttons">
                    <button class="primary" id="alert-ok">OK</button>
                </div>
            </div>
        </div>

        <div id="prompt-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="prompt-title">Input Required</h2>
                <p id="prompt-message"></p>
                <input type="text" id="prompt-input" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; background: var(--color-background); color: var(--color-white); border: 1px solid #444; border-radius: 4px;" autofocus>
                <div class="modal-buttons">
                    <button class="primary" id="prompt-confirm">OK</button>
                    <button id="prompt-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </body>
</html>
